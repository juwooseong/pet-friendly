server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: petspot-backend

  # 개발 DB = Docker의 petspot-db (호스트 포트 5433)의 petspot_db. 2026-11-20 Windows PostgreSQL 제거 후 통일.
  # 테스트는 같은 컨테이너의 petspot_test를 쓴다(src/test/resources/config/application.yml, TSK-QA-003).
  # 비밀번호는 루트 .env의 DB_PASSWORD를 쓴다(gradle test/bootRun이 .env를 환경변수로 넣어 준다 - build.gradle 참고).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/petspot_db}
    username: ${DB_USERNAME:petspot}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway for schema migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  # 리뷰 사진 업로드 한도 (화면에서 줄여 올리므로 보통 1MB 미만). nginx client_max_body_size도 함께 맞춘다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # 비밀번호 재설정 메일 링크에 넣을 사이트 주소 (TSK-SEC-003). 로컬 개발은 Vite 개발 서버.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # 리뷰 사진 저장 폴더 (하위 reviews/). Docker에서는 볼륨(/app/uploads)에 저장한다.
  upload-dir: ${UPLOAD_DIR:./uploads}

jwt:
  secret: petspot_super_secret_jwt_key_that_is_at_least_32_bytes_long_for_security
  expiration-ms: 86400000 # 24 Hours

public-data:
  tour-api:
    service-key: test-service-key
    # 실제 호출 검증 결과(TSK-DATA-002): B551011/KorPetTourService2 가 유효한 게이트웨이 경로로 확인됨.
    # ("KorPetTourService"는 경로 자체가 존재하지 않아 NO_OPENAPI_SERVICE_ERROR(12) 반환)
    baseUrl: https://apis.data.go.kr/B551011/KorPetTourService2
    mobile-os: ETC
    mobile-app: PetSpot
  batch:
    # 로컬 개발·테스트에서는 자동 수집을 하지 않는다. Docker(prod 프로필)에서는 켜져 있다(application-prod.yml, 2026-11-23).
    # (수동 1회 실행은 enabled와 무관하게 아래 run-on-startup 옵션으로만 동작한다)
    enabled: false
    cron: "0 0 3 * * *"
    page-size: 100
    # 배치 1회 실행 = 장소 동기화(petTourSyncList2, 마지막 동기화 날짜부터 바뀐 장소만 - 보통 하루 1~2회 호출, TSK-DATA-012)
    #              + 반려동물 정책(detailPetTour2, 장소당 1회 호출, TSK-DATA-010).
    # 정책은 아직 조회하지 않았거나 정보가 바뀐 장소부터 아래 건수까지만 처리하고, 다음 실행에서 이어 간다(일일 트래픽 한도 대응).
    sync-place-list: true          # false면 장소 동기화는 건너뛰고 정책 조회만 이어서 진행
    sync-since: ""                 # 동기화 진행 날짜가 없을 때(첫 실행) 기준일 yyyyMMdd. 비우면 첫 실행은 전체(약 101회)
    pet-policy-max-calls: 800      # 장소 동기화 호출과 합쳐 data.go.kr 일일 한도 안으로 설정
    image-backfill-max-places: 100 # 대표 사진 없는 장소의 상세를 미리 받을 최대 장소 수(장소당 상세 API 2~3회, TSK-DATA-013)
    pet-policy-call-delay-ms: 100
    # 지금 한 번 실행: --public-data.batch.run-on-startup=true (TourDataBatchRunner)
    # 실행 후 종료까지: --spring.main.web-application-type=none --public-data.batch.exit-after-run=true
    #   + --spring.devtools.restart.enabled=false (빠뜨리면 실행 중 DevTools 재시작으로 배치가 두 번 돈다)

