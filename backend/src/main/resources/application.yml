server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: petspot-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/petspot_db
    username: petspot
    password: petspot1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway for schema migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: petspot_super_secret_jwt_key_that_is_at_least_32_bytes_long_for_security
  expiration-ms: 86400000 # 24 Hours

public-data:
  tour-api:
    service-key: test-service-key
    baseUrl: https://apis.data.go.kr/B551011/KorPetTourService
    mobile-os: ETC
    mobile-app: PetSpot
  batch:
    enabled: true
    cron: "0 0 3 * * *"
    page-size: 100

