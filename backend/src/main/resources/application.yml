server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: petspot-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/petspot_db
    username: petspot
    password: petspot1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway for schema migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: petspot_super_secret_jwt_key_that_is_at_least_32_bytes_long_for_security
  expiration-ms: 86400000 # 24 Hours

public-data:
  tour-api:
    service-key: test-service-key
    # 실제 호출 검증 결과(TSK-DATA-002): B551011/KorPetTourService2 가 유효한 게이트웨이 경로로 확인됨.
    # ("KorPetTourService"는 경로 자체가 존재하지 않아 NO_OPENAPI_SERVICE_ERROR(12) 반환)
    baseUrl: https://apis.data.go.kr/B551011/KorPetTourService2
    mobile-os: ETC
    mobile-app: PetSpot
  batch:
    # 자동 수집 비활성화(2026-11-19): collectAllPlaces는 전체 페이지를 순회하므로, 호출 속도 제한/일일 트래픽
    # 한도 대응이 설계된 TSK-DATA-003-C(전국 초기 적재) 완료 전까지는 스케줄 실행을 막는다.
    # 필요 시 -Dpublic-data.batch.enabled=true 또는 프로필 설정으로만 명시적으로 켠다.
    enabled: false
    cron: "0 0 3 * * *"
    page-size: 100
    # TSK-DATA-010: 배치 1회 실행 = 장소 목록(전국 약 97회 호출) + 반려동물 정책(detailPetTour2, 장소당 1회 호출).
    # 정책은 아직 조회하지 않은 장소부터 아래 건수까지만 처리하고, 다음 실행에서 이어 간다(일일 트래픽 한도 대응).
    sync-place-list: true          # false면 목록은 건너뛰고 정책 조회만 이어서 진행
    pet-policy-max-calls: 800      # 목록 호출과 합쳐 data.go.kr 일일 한도 안으로 설정
    pet-policy-call-delay-ms: 100
    # 지금 한 번 실행: --public-data.batch.run-on-startup=true (TourDataBatchRunner)
    # 실행 후 종료까지: --spring.main.web-application-type=none --public-data.batch.exit-after-run=true

