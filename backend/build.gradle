plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.petspot'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web & Security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // JPA & PostGIS Hibernate Spatial
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.locationtech.jts:jts-core:1.19.0'
    
    // Flyway DB Migration & PostgreSQL Driver
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'
    
    // Redis & Caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // JWT (JSON Web Token)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Lombok & DevTools
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // QueryDSL & Spatial Query Support
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    implementation 'com.querydsl:querydsl-spatial:5.0.0'

    // Swagger OpenAPI Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

/**
 * 루트 .env(gitignore 대상, docker-compose와 공용)를 읽어 테스트/로컬 실행의 환경변수로 넣는다.
 * DB 비밀번호 같은 비밀값을 application.yml에 적지 않고 Docker DB(petspot-db)에 연결하기 위함.
 * 이미 OS 환경변수로 설정된 값은 덮어쓰지 않는다.
 */
def dotEnv = { ->
    def file = rootProject.file('../.env')
    def values = [:]
    if (file.exists()) {
        file.eachLine('UTF-8') { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def idx = trimmed.indexOf('=')
                def key = trimmed.substring(0, idx).trim()
                if (!System.getenv(key)) {
                    values[key] = trimmed.substring(idx + 1).trim()
                }
            }
        }
    }
    values
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트가 실제 메일을 보내지 않도록 메일 계정은 넘기지 않는다.
    environment dotEnv().findAll { !it.key.startsWith('MAIL_') }
}

tasks.named('bootRun') {
    environment dotEnv()
}
