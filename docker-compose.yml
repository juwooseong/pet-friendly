# PetSpot 전체 실행 구성 (DB + Redis + 백엔드 + 프런트엔드)
#   실행: docker compose up -d --build
#   프런트만 다시 배포: docker compose up -d --build --no-deps petspot-web   (--no-deps 없으면 백엔드도 재시작됨)
#   접속: http://localtest.me   (Swagger: /swagger-ui/index.html)
#         Kakao 지도는 콘솔에 등록된 도메인에서만 동작하고 localhost는 등록할 수 없어 localtest.me(=127.0.0.1)로 접속한다.
#         Kakao 콘솔 Web 플랫폼 사이트 도메인: http://localtest.me (Docker), http://localtest.me:3000 (Vite 개발 서버)
# 비밀값은 루트 .env(gitignore 대상)에서 읽는다. 항목은 .env.example 참고.
#
# petspot-db(호스트 5433)는 로컬 개발(bootRun, petspot_db)과 백엔드 테스트(gradle test, petspot_test - TSK-QA-003)도 함께 쓴다.
# 백엔드 API는 로컬 bootRun(8080)과 겹치지 않도록 호스트 8081로 노출한다.

services:
  # PostgreSQL 17 + PostGIS (개발 DB와 같은 메이저 버전)
  petspot-db:
    image: postgis/postgis:17-3.5
    container_name: petspot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: petspot_db
      POSTGRES_USER: ${DB_USERNAME:-petspot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-petspot} -d petspot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis In-Memory Cache
  petspot-redis:
    image: redis:7-alpine
    container_name: petspot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot 백엔드 (내장 Tomcat)
  petspot-api:
    build: ./backend
    image: petspot-api:latest
    container_name: petspot-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://petspot-db:5432/petspot_db
      DB_USERNAME: ${DB_USERNAME:-petspot}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: petspot-redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 비밀번호 재설정 메일 링크의 사이트 주소 (TSK-SEC-003)
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localtest.me}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m}
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      petspot-db:
        condition: service_healthy
      petspot-redis:
        condition: service_healthy

  # Vue 빌드 결과 + Nginx (/api 는 petspot-api 로 프록시)
  petspot-web:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_MAP_APP_KEY: ${VITE_KAKAO_MAP_APP_KEY:-}
    image: petspot-web:latest
    container_name: petspot-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - petspot-api

volumes:
  postgres_data:
  redis_data:
