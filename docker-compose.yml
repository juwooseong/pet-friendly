version: '3.8'

services:
  # PostgreSQL 15 with PostGIS Spatial Extension
  petspot-db:
    image: postgis/postgis:15-3.3
    container_name: petspot-db
    environment:
      POSTGRES_DB: petspot_db
      POSTGRES_USER: petspot
      POSTGRES_PASSWORD: petspot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petspot -d petspot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache
  petspot-redis:
    image: redis:7-alpine
    container_name: petspot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
