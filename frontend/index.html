<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 홈 대표 그림(LCP) 미리 받기 - HomePage.vue의 picture와 같은 media 조건 (TSK-FE-028) -->
    <link rel="preload" as="image" href="/images/duo-together-640.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/duo-together.webp" media="(min-width: 768px)" fetchpriority="high" />
    <title>PetSpot 펫스팟 - 헛걸음 없는 반려동물 여행</title>
    <meta name="description" content="우리 아이 크기로 함께 갈 수 있는 반려동물 동반 장소를 찾아보세요. 한국관광공사 공공데이터 기반 전국 동반 장소와 동반 조건." />

    <!-- 브랜드 아이콘 (TSK-FE-031). 다시 만들기: node scripts/make-brand-icons.mjs -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2fb585" />

    <!-- 공유 미리보기. 이미지 주소는 절대 주소여야 해서 VITE_SITE_URL(.env.*)을 붙인다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetSpot" />
    <meta property="og:title" content="PetSpot 펫스팟 - 헛걸음 없는 반려동물 여행" />
    <meta property="og:description" content="우리 아이 크기로 함께 갈 수 있는 곳만 골라 보세요. 콩이와 나비가 먼저 다녀왔어요." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="웰시코기 콩이와 치즈 고양이 나비가 배낭을 메고 함께 여행하는 그림" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
