server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 백엔드 API (같은 주소로 제공하므로 CORS 불필요)
    location /api/ {
        proxy_pass http://petspot-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 장소 상세 첫 조회 시 TourAPI 호출이 포함될 수 있어 여유 있게 둔다
        proxy_read_timeout 60s;
    }

    # Swagger UI
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://petspot-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 빌드 산출물(해시 파일명)은 장기 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 앱 매니페스트 (TSK-FE-031): 기본 mime.types에 없어 application/octet-stream으로 나가던 것을 바로잡는다
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        try_files $uri =404;
    }

    # Vue Router history 모드: 새로고침 시 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
